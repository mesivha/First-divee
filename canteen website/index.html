<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="registration-form">
        <img src="Scribbles.png" alt="">
        <h2>Login here</h2>
        <form id="registrationForm">
            <div class="form-group">
                <label for="adm no.">Admission Number:</label>
                <input type="text" id="user" class="user" placeholder="Enter your adm No." required>
                <label for="password">Password:</label>
                <input type="password" id="pass" class="pass"
                name="password" placeholder="Enter your roll no." required>
                <div class="one"><button type="submit" class="submit-btn">Register</button></div>
            </div>
        </form>
        <div id="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
